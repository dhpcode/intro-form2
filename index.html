<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro form project</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/styles.css">

</head>

<body>
  <main class="main-content">
    <div class="container">
      <!-- INTRO PAGE -->
      <div class="intro-page">
        <!-- Hero -->
        <div class="intro-page__hero hero">
          <div class="hero__main">
            <div class="hero__badge">
              frontend and backend
            </div>
            <h1 class="hero__heading">
              Learn to program by <br> watching <br>professionals
            </h1>
            <p class="hero__text">
              See how experienced developers solve <br> problems in real time
            </p>
          </div>
          <div class="hero__bottom">
            <strong>Try it free 7 days</strong>, then $20/mo
          </div>
        </div>

        <!-- Registration form -->
        <form class="signup-form" action="echo.htmlacademy.ru" method="get">
          <h2 class="signup-form__heading">
            Sign up for the course and get free 7 days
          </h2>

          <div class="signup-form__fields">
            <input class="signup-form__field" type="text" name="name" placeholder="First name" aria-label="name"
              required>
            <input class="signup-form__field" type="text" name="lastname" placeholder="Last name" aria-label="Last name"
              required>
            <input class="signup-form__field" type="email" name="email" placeholder="Email Address"
              aria-label="Email Address" required>
            <input class="signup-form__field" type="password" name="password" placeholder="Password"
              aria-label="Password" required>
          </div>

          <button class="signup-form__submit" type="submit">Claim your free trial</button>
          <div class="signup-form__notice">
            By clicking the button, you are agreeing to our
            <a href="#" class="signup-form__notice-link">Terms and Services</a>
          </div>

        </form>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>

</html>
